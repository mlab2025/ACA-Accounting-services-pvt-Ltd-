<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Micron Laboratory - Search Test & Rate</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8f6;color:#263238}.container{max-width:1400px;margin:30px auto;padding:0 15px}.header{background:#009b57;color:#fff;padding:18px 24px;border-radius:12px 12px 0 0;display:flex;align-items:center;gap:15px}.header h1{margin:0;font-size:25px}.header p{margin:5px 0}.logo{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}.search-box{background:#fff;padding:16px;display:flex;gap:10px;border:1px solid #ddd}.search-box input{flex:1;padding:13px;border:1px solid #ccc;border-radius:6px;font-size:15px}.search-box button{background:#009b57;color:#fff;border:0;border-radius:6px;padding:0 25px;font-weight:bold;cursor:pointer}.table-container{overflow:auto;background:#fff}table{width:100%;border-collapse:collapse;min-width:1050px}th{background:#009b57;color:#fff;padding:11px;text-align:left;font-size:12px}td{padding:11px;border-bottom:1px solid #e3e9e6;font-size:13px}tr:nth-child(even) td{background:#effaf5}.eye-button{border:0;background:#e3f6ed;color:#00894d;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:17px}.no-result{text-align:center;padding:30px;color:#777}.count{background:#fff;padding:10px 15px;color:#555;border:1px solid #ddd;border-top:0}.modal{display:none;position:fixed;inset:0;background:#000a;z-index:9999;padding:20px;align-items:center;justify-content:center}.modal.show{display:flex}.modal-box{background:#fff;width:min(950px,100%);max-height:92vh;border-radius:12px;overflow:hidden}.modal-header{background:#009b57;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.modal-header h2{margin:0;font-size:20px}.close{border:0;background:none;color:#fff;font-size:28px;cursor:pointer}.modal-content{padding:17px;overflow-y:auto;max-height:calc(92vh - 65px)}.section{border:1px solid #dce8e3;border-radius:7px;margin-bottom:15px;overflow:hidden}.section-title{background:#e8f8f0;color:#006d40;font-weight:bold;padding:11px 14px}.details-grid{display:grid;grid-template-columns:220px 1fr}.details-grid div{padding:10px 13px;border-top:1px solid #edf1ef;font-size:13px}.label{font-weight:bold;background:#fafcfb}.note{padding:14px;line-height:1.6;font-size:13px}@media(max-width:600px){.search-box{flex-direction:column}.search-box button{height:44px}.details-grid{grid-template-columns:1fr}.modal{padding:8px}}
</style>
</head>
<body>
<div class="container">
<div class="header"><img class="logo" src="micron-logo.png" alt="Micron Laboratory" onerror="this.style.display='none'"><div><h1>Micron Laboratory</h1><p>Search Test & Rate</p></div></div>
<div class="search-box"><input id="searchInput" type="search" placeholder="Search by Test Code or Test Name..."><button onclick="searchTests()">Search</button></div>
<div class="count" id="count">Loading tests...</div>
<div class="table-container"><table><thead><tr><th>👁</th><th>S.No</th><th>Test Code</th><th>Test Name</th><th>Test Type</th><th>Sample Quantity</th><th>Fasting</th><th>Schedule</th><th>TAT</th><th>Price</th></tr></thead><tbody id="testTable"><tr><td colspan="10" class="no-result">Loading tests...</td></tr></tbody></table></div>
</div>

<div class="modal" id="testModal"><div class="modal-box"><div class="modal-header"><h2 id="modalTitle">Test Details</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-content">
<div class="section"><div class="section-title">Test Information</div><div class="details-grid" id="testInfo"></div></div>
<div class="section"><div class="section-title">Sample / Collection Information</div><div class="details-grid" id="sampleInfo"></div></div>
<div class="section"><div class="section-title">Report / Schedule Information</div><div class="details-grid" id="reportInfo"></div></div>
<div class="section"><div class="section-title">Additional Details</div><div class="note" id="extraInfo"></div></div>
</div></div></div>

<script>
let tests=[],filteredTests=[];
const val=v=>(v===undefined||v===null||String(v).trim()==="")?"—":String(v);
const row=(label,v)=>`<div class="label">${label}</div><div>${val(v)}</div>`;

fetch("tests.json").then(r=>{if(!r.ok)throw Error("tests.json not found");return r.json()}).then(data=>{tests=Array.isArray(data)?data:[];displayTests(tests)}).catch(e=>{document.getElementById("testTable").innerHTML='<tr><td colspan="10" class="no-result">tests.json load nahi ho raha.</td></tr>';document.getElementById("count").textContent="Data load error";console.error(e)});

function displayTests(list){filteredTests=list;const tb=document.getElementById("testTable");tb.innerHTML="";document.getElementById("count").textContent=list.length+" test(s) found";if(!list.length){tb.innerHTML='<tr><td colspan="10" class="no-result">No Test Found</td></tr>';return}list.forEach((t,i)=>{let tr=document.createElement("tr");tr.innerHTML=`<td><button class="eye-button" onclick="openDetails(${i})">👁</button></td><td>${i+1}</td><td>${val(t.code)}</td><td>${val(t.name)}</td><td>${val(t.testType)}</td><td>${val(t.sampleQuantity)}</td><td>${val(t.fasting)}</td><td>${val(t.schedule)}</td><td>${val(t.tat)}</td><td>${val(t.price)}</td>`;tb.appendChild(tr)})}

function searchTests(){let q=document.getElementById("searchInput").value.toLowerCase().trim();if(!q){displayTests(tests);return}displayTests(tests.filter(t=>[t.code,t.name,t.testType,t.method].some(x=>String(x||"").toLowerCase().includes(q))))}
document.getElementById("searchInput").addEventListener("input",searchTests);

function openDetails(i){let t=filteredTests[i];if(!t)return;document.getElementById("modalTitle").textContent=val(t.name);
document.getElementById("testInfo").innerHTML=row("Test Code",t.code)+row("Test Name",t.name)+row("Test Type",t.testType)+row("Method",t.method)+row("Price",t.price);
document.getElementById("sampleInfo").innerHTML=row("Sample Quantity",t.sampleQuantity)+row("Fasting",t.fasting)+row("Sample Guideline",t.sampleGuideline);
document.getElementById("reportInfo").innerHTML=row("Schedule",t.schedule)+row("TAT / Reported On",t.tat);
let used=["code","name","testType","method","sampleQuantity","fasting","schedule","tat","price","sampleGuideline"];let extras=Object.keys(t).filter(k=>!used.includes(k));document.getElementById("extraInfo").innerHTML=extras.length?extras.map(k=>`<p><b>${pretty(k)}:</b> ${val(t[k])}</p>`).join(""):"No additional information available in the source data.";
document.getElementById("testModal").classList.add("show");document.body.style.overflow="hidden"}
function pretty(k){return k.replace(/([A-Z])/g," $1").replace(/^./,s=>s.toUpperCase())}
function closeModal(){document.getElementById("testModal").classList.remove("show");document.body.style.overflow=""}
document.getElementById("testModal").addEventListener("click",e=>{if(e.target===e.currentTarget)closeModal()});
</script>
</body></html>
